<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Purple rounded square background -->
  <rect width="512" height="512" rx="96" ry="96" fill="#7c3aed"/>
  <!-- Broomstick outline in black -->
  <g stroke="#000000" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Handle -->
    <line x1="256" y1="60" x2="256" y2="300"/>
    <!-- Bristle bundle: fan shape at bottom -->
    <path d="M 256 300 Q 200 320 170 400"/>
    <path d="M 256 300 Q 220 315 200 410"/>
    <path d="M 256 300 L 230 420"/>
    <path d="M 256 300 L 256 430"/>
    <path d="M 256 300 L 282 420"/>
    <path d="M 256 300 Q 292 315 312 410"/>
    <path d="M 256 300 Q 312 320 342 400"/>
    <!-- Tie band around bristles -->
    <path d="M 226 305 Q 256 315 286 305" stroke-width="10"/>
  </g>
</svg>
