<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Purple rounded square background -->
  <rect width="512" height="512" rx="96" ry="96" fill="#7c3aed"/>
  <!-- Broom outline in black - Fantasia style -->
  <g stroke="#000000" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Handle -->
    <line x1="256" y1="40" x2="256" y2="260"/>
    <!-- Bristle bundle: rounded/fan shape -->
    <!-- Outer left curve -->
    <path d="M 256 260 C 230 270 180 300 140 380"/>
    <!-- Outer right curve -->
    <path d="M 256 260 C 282 270 332 300 372 380"/>
    <!-- Bottom connecting curve -->
    <path d="M 140 380 C 200 420 312 420 372 380"/>
    <!-- Inner bristle lines for texture -->
    <path d="M 256 260 C 240 280 200 330 170 390"/>
    <path d="M 256 260 C 248 285 220 340 200 400"/>
    <path d="M 256 260 L 230 405"/>
    <path d="M 256 260 L 256 410"/>
    <path d="M 256 260 L 282 405"/>
    <path d="M 256 260 C 264 285 292 340 312 400"/>
    <path d="M 256 260 C 272 280 312 330 342 390"/>
    <!-- Tie band -->
    <path d="M 228 275 Q 256 288 284 275" stroke-width="10"/>
  </g>
</svg>
